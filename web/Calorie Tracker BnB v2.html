<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Трекер калорий</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #f6f5f1;
    --surface: #ffffff;
    --surface-2: #f0efe9;
    --text: #1d1c19;
    --muted: #6d6a62;
    --border: #e3e1d9;
    --accent: #2f7d5b;
    --accent-soft: #e2f0e8;
    --on-accent: #ffffff;
    --protein: #3b6fd8;
    --fat: #d89b2b;
    --carbs: #8a5bd6;
    --danger: #c2413a;
    --warn-bg: #fff4dd;
    --warn-text: #7a5410;
    --shadow: 0 1px 2px rgb(0 0 0 / .05), 0 4px 16px rgb(0 0 0 / .06);
    --radius: 16px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141513;
      --surface: #1d1f1c;
      --surface-2: #262825;
      --text: #ecebe6;
      --muted: #a3a197;
      --border: #33352f;
      --accent: #5cc093;
      --accent-soft: #1f3a2d;
      --on-accent: #0e1a14;
      --protein: #7aa2f7;
      --fat: #e8b65a;
      --carbs: #b392f0;
      --danger: #ef7a72;
      --warn-bg: #3a2f17;
      --warn-text: #f1d49a;
      --shadow: 0 1px 2px rgb(0 0 0 / .3);
    }
  }
  :root[data-theme="dark"] {
    --bg: #141513;
    --surface: #1d1f1c;
    --surface-2: #262825;
    --text: #ecebe6;
    --muted: #a3a197;
    --border: #33352f;
    --accent: #5cc093;
    --accent-soft: #1f3a2d;
    --on-accent: #0e1a14;
    --protein: #7aa2f7;
    --fat: #e8b65a;
    --carbs: #b392f0;
    --danger: #ef7a72;
    --warn-bg: #3a2f17;
    --warn-text: #f1d49a;
    --shadow: 0 1px 2px rgb(0 0 0 / .3);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  button, input, select { font: inherit; color: inherit; }
  .app { max-width: 560px; margin: 0 auto; padding: 16px 16px calc(96px + env(safe-area-inset-bottom)); }
  h1 { font-size: 24px; margin: 4px 0 16px; letter-spacing: -.01em; }
  h2 { font-size: 16px; margin: 0 0 10px; }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }
  .hidden { display: none !important; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; box-shadow: var(--shadow); }
  .row { display: flex; align-items: center; gap: 10px; }
  .between { justify-content: space-between; }
  .grow { flex: 1; min-width: 0; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .btn { border: 0; border-radius: 12px; padding: 11px 16px; background: var(--accent); color: var(--on-accent); font-weight: 600; cursor: pointer; }
  .btn:disabled { opacity: .6; cursor: default; }
  .btn.ghost { background: var(--surface-2); color: var(--text); }
  .btn.sm { padding: 6px 10px; font-size: 13px; border-radius: 10px; }
  .btn.block { width: 100%; }
  .icon-btn { border: 0; background: var(--surface-2); width: 36px; height: 36px; border-radius: 10px; cursor: pointer; display: inline-grid; place-items: center; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
  input, select { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { border: 1px solid var(--border); border-radius: 999px; padding: 5px 11px; font-size: 13px; background: var(--surface); cursor: pointer; }
  .chip.on { background: var(--accent-soft); border-color: var(--accent); color: var(--text); }
  .tag { font-size: 11px; padding: 2px 7px; border-radius: 999px; background: var(--surface-2); color: var(--muted); }
  .error { color: var(--danger); font-size: 13px; min-height: 18px; margin-top: 8px; }
  .warn { background: var(--warn-bg); color: var(--warn-text); border-radius: 12px; padding: 10px 12px; font-size: 13px; margin-top: 10px; }
  .seg { display: flex; background: var(--surface-2); border-radius: 12px; padding: 3px; margin-bottom: 12px; }
  .seg button { flex: 1; border: 0; background: transparent; padding: 8px; border-radius: 10px; cursor: pointer; font-weight: 600; color: var(--muted); }
  .seg button.on { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }

  /* auth */
  .auth { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
  .auth .card { width: 100%; max-width: 400px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 20px; margin-bottom: 16px; }
  .logo { width: 36px; height: 36px; border-radius: 10px; background: var(--accent); display: grid; place-items: center; color: var(--on-accent); }

  /* today */
  .datebar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .datebar strong { font-size: 17px; }
  .summary { display: flex; gap: 16px; align-items: center; }
  .ring { position: relative; width: 132px; height: 132px; flex: none; }
  .ring svg { transform: rotate(-90deg); }
  .ring .center { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
  .ring .big { font-size: 26px; font-weight: 700; line-height: 1.1; }
  .ring .center .small { max-width: 96px; margin: 0 auto; line-height: 1.2; }
  .macro { margin: 6px 0; }
  .bar { height: 8px; background: var(--surface-2); border-radius: 99px; overflow: hidden; margin-top: 3px; }
  .bar > i { display: block; height: 100%; border-radius: 99px; }
  .meal-head { display: flex; justify-content: space-between; align-items: center; }
  .entry { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--border); }
  .entry:first-of-type { border-top: 0; }
  .entry .kcal { font-weight: 600; white-space: nowrap; }
  .entry button { border: 0; background: none; color: var(--muted); cursor: pointer; padding: 4px 6px; font-size: 18px; }

  /* menu */
  .dish { display: flex; gap: 12px; padding: 12px 0; border-top: 1px solid var(--border); }
  .dish:first-of-type { border-top: 0; }
  .dish .meal { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--accent); font-weight: 700; }
  .dish .name { font-weight: 600; }
  .macros-inline { font-size: 12px; color: var(--muted); }
  .macros-inline b { font-weight: 600; }
  .nw { white-space: nowrap; }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin: 0 3px 1px 6px; }

  /* progress */
  .bars { display: flex; align-items: flex-end; gap: 6px; height: 140px; padding-top: 8px; position: relative; }
  .bars .col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; height: 100%; justify-content: flex-end; }
  .bars .col i { width: 100%; max-width: 30px; background: var(--accent); border-radius: 6px 6px 2px 2px; min-height: 2px; }
  .bars .col i.over { background: var(--fat); }
  .bars .col span { font-size: 11px; color: var(--muted); }
  .target-line { position: absolute; left: 0; right: 0; border-top: 1.5px dashed var(--muted); opacity: .6; }
  .weight-list div { display: flex; justify-content: space-between; padding: 6px 0; border-top: 1px solid var(--border); font-size: 14px; }

  /* bottom nav bar */
  nav.bnb {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    background: var(--surface); border-top: 1px solid var(--border);
    padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
  }
  nav.bnb .inner { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); align-items: center; }
  nav.bnb button { border: 0; background: none; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; color: var(--muted); padding: 6px 0; }
  nav.bnb button.on { color: var(--accent); font-weight: 600; }
  nav.bnb svg { width: 22px; height: 22px; }
  nav.bnb .fab { width: 52px; height: 52px; margin: -22px auto 0; border-radius: 50%; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; box-shadow: 0 4px 14px rgb(0 0 0 / .2); }
  nav.bnb .fab svg { width: 26px; height: 26px; }

  /* bottom sheet */
  .sheet-backdrop { position: fixed; inset: 0; background: rgb(0 0 0 / .35); z-index: 20; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; background: var(--surface); border-radius: 20px 20px 0 0; max-height: 88vh; display: flex; flex-direction: column; max-width: 560px; margin: 0 auto; }
  .sheet .grab { width: 40px; height: 4px; border-radius: 4px; background: var(--border); margin: 8px auto 4px; }
  .sheet .body { padding: 8px 16px calc(16px + env(safe-area-inset-bottom)); overflow-y: auto; }
  .result { display: flex; align-items: center; gap: 10px; padding: 10px 4px; border-top: 1px solid var(--border); cursor: pointer; border-radius: 8px; }
  .result:hover { background: var(--surface-2); }
  .toast { position: fixed; left: 50%; bottom: calc(90px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 14px; z-index: 30; max-width: calc(100% - 32px); }
  .empty { text-align: center; color: var(--muted); padding: 20px 8px; font-size: 14px; }
</style>
</head>
<body>

<!-- ============ AUTH ============ -->
<div id="loading" class="auth hidden"><div class="muted">Загрузка…</div></div>

<section id="auth" class="auth hidden">
  <div class="card">
    <div class="brand"><div class="logo">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 3c3 3 6 6.5 6 10a6 6 0 0 1-12 0c0-2 1-4 2.5-5.5C9 9.5 10 11 11 11c0-3 0-5 1-8z"/></svg>
    </div>Трекер калорий</div>
    <div class="seg" id="authSeg">
      <button data-mode="login" class="on">Вход</button>
      <button data-mode="register">Регистрация</button>
    </div>
    <form id="authForm" novalidate>
      <div id="nameField" class="hidden">
        <label for="authName">Имя</label>
        <input id="authName" autocomplete="name">
      </div>
      <label for="authEmail">Эл. почта</label>
      <input id="authEmail" type="email" autocomplete="email" required>
      <label for="authPassword">Пароль (не менее 8 символов)</label>
      <input id="authPassword" type="password" autocomplete="current-password" minlength="8" required>
      <div class="error" id="authError"></div>
      <button class="btn block" id="authSubmit">Войти</button>
    </form>
  </div>
</section>

<!-- ============ APP ============ -->
<main id="app" class="app hidden">

  <!-- TODAY -->
  <section data-view="today">
    <div class="datebar">
      <button class="icon-btn" id="prevDay" aria-label="Предыдущий день">‹</button>
      <div style="text-align:center"><strong id="dayTitle">Сегодня</strong><div class="small muted" id="daySub"></div></div>
      <button class="icon-btn" id="nextDay" aria-label="Следующий день">›</button>
    </div>
    <div class="card">
      <div class="summary">
        <div class="ring">
          <svg width="132" height="132" viewBox="0 0 132 132">
            <circle cx="66" cy="66" r="56" fill="none" stroke="var(--surface-2)" stroke-width="12"/>
            <circle id="ringArc" cx="66" cy="66" r="56" fill="none" stroke="var(--accent)" stroke-width="12" stroke-linecap="round" stroke-dasharray="0 400"/>
          </svg>
          <div class="center"><div class="big" id="remaining">–</div><div class="small muted" id="remainingLabel">ккал осталось</div></div>
        </div>
        <div class="grow" id="macroBars"></div>
      </div>
      <div class="row between small muted" style="margin-top:12px">
        <span>Съедено <b id="eaten" style="color:var(--text)">0</b></span>
        <span>Норма <b id="target" style="color:var(--text)">–</b></span>
      </div>
    </div>
    <div id="meals"></div>
  </section>

  <!-- MENU -->
  <section data-view="menu" class="hidden">
    <h1>Меню на день</h1>
    <div class="card">
      <div class="row between">
        <div><div class="small muted" id="menuDate"></div><div id="menuTotals" class="small"></div></div>
        <button class="btn" id="genMenu">Подобрать</button>
      </div>
      <div class="error" id="menuError"></div>
    </div>
    <div class="card" id="menuCard"><div class="empty">Подберём меню из готовых блюд под вашу норму калорий и БЖУ.</div></div>
    <button class="btn block hidden" id="logMenu">Добавить всё меню в дневник</button>
  </section>

  <!-- PROGRESS -->
  <section data-view="progress" class="hidden">
    <h1>Прогресс</h1>
    <div class="card">
      <h2>Последние 7 дней</h2>
      <div class="bars" id="historyBars"></div>
      <div class="small muted" id="historyAvg" style="margin-top:8px"></div>
    </div>
    <div class="card">
      <h2>Вес</h2>
      <form class="row" id="weightForm">
        <input id="weightInput" type="number" step="0.1" min="30" max="350" placeholder="кг" class="grow" required>
        <button class="btn">Записать</button>
      </form>
      <div class="weight-list" id="weightList" style="margin-top:10px"></div>
    </div>
  </section>

  <!-- PROFILE -->
  <section data-view="profile" class="hidden">
    <h1 id="profileTitle">Ваш профиль</h1>
    <div class="card hidden" id="targetsCard"></div>
    <form class="card" id="profileForm" novalidate>
      <h2>Параметры</h2>
      <div class="grid2">
        <div><label for="pSex">Пол</label><select id="pSex"><option value="female">Женский</option><option value="male">Мужской</option></select></div>
        <div><label for="pBirth">Дата рождения</label><input id="pBirth" type="date" required></div>
        <div><label for="pHeight">Рост, см</label><input id="pHeight" type="number" min="100" max="250" step="0.5" required></div>
        <div><label for="pWeight">Вес, кг</label><input id="pWeight" type="number" min="30" max="350" step="0.1" required></div>
      </div>
      <label for="pFat">Процент жира, % (необязательно, для формулы Кэтча — МакАрдла)</label>
      <input id="pFat" type="number" min="3" max="60" step="0.5" placeholder="например, 22">
      <label for="pActivity">Активность</label>
      <select id="pActivity">
        <option value="sedentary">Минимальная: сидячая работа, почти без спорта</option>
        <option value="light">Низкая: тренировки 1–3 раза в неделю</option>
        <option value="moderate">Средняя: тренировки 3–5 раз в неделю</option>
        <option value="active">Высокая: интенсивные тренировки 6–7 раз в неделю</option>
        <option value="very_active">Очень высокая: физическая работа и тренировки</option>
      </select>
      <h2 style="margin-top:18px">Цель</h2>
      <div class="seg" id="goalSeg">
        <button type="button" data-v="lose">Похудеть</button>
        <button type="button" data-v="maintain">Удержать</button>
        <button type="button" data-v="gain">Набрать</button>
      </div>
      <div id="rateField">
        <label for="pRate">Темп: <b id="rateLabel"></b> кг в неделю</label>
        <input id="pRate" type="range" min="0.25" max="1" step="0.05">
      </div>
      <h2 style="margin-top:18px">Питание</h2>
      <label for="pDiet">Рацион</label>
      <select id="pDiet">
        <option value="omnivore">Ем всё</option>
        <option value="pescatarian">Пескетарианство (без мяса, с рыбой)</option>
        <option value="vegetarian">Вегетарианство</option>
        <option value="vegan">Веганство</option>
      </select>
      <label>Исключить аллергены</label>
      <div class="chips" id="allergenChips"></div>
      <label for="pMeals">Приёмов пищи в день</label>
      <select id="pMeals"><option value="4">4: завтрак, обед, ужин, перекус</option><option value="3">3: завтрак, обед, ужин</option></select>
      <div class="error" id="profileError"></div>
      <button class="btn block" id="saveProfile">Сохранить</button>
    </form>
    <button class="btn ghost block" id="logout">Выйти</button>
  </section>
</main>

<nav class="bnb hidden" id="bnb">
  <div class="inner">
    <button data-tab="today" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l2.5 2"/></svg>Сегодня</button>
    <button data-tab="menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M7 3v8a2 2 0 0 0 2 2v8M5 3v5M9 3v5M17 21V3c-2 1.5-3 4-3 7v3h3"/></svg>Меню</button>
    <button data-tab="add" aria-label="Добавить еду"><span class="fab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span></button>
    <button data-tab="progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Прогресс</button>
    <button data-tab="profile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Профиль</button>
  </div>
</nav>

<!-- ADD SHEET -->
<div class="sheet-backdrop hidden" id="sheetBackdrop"></div>
<div class="sheet hidden" id="sheet" role="dialog" aria-label="Добавить еду">
  <div class="grab"></div>
  <div class="body">
    <div id="searchStep">
      <div class="seg" id="sourceSeg">
        <button data-src="foods" class="on">Продукты</button>
        <button data-src="dishes">Готовые блюда</button>
      </div>
      <input id="searchInput" placeholder="Поиск…" autocomplete="off">
      <div id="results" style="margin-top:8px"></div>
    </div>
    <div id="amountStep" class="hidden">
      <button class="btn ghost sm" id="backToSearch">‹ Назад</button>
      <h2 id="pickName" style="margin-top:12px"></h2>
      <div class="small muted" id="pickInfo"></div>
      <div class="grid2">
        <div><label for="amount" id="amountLabel">Граммы</label><input id="amount" type="number" min="1" step="1"></div>
        <div><label for="mealSelect">Приём пищи</label>
          <select id="mealSelect"><option value="breakfast">Завтрак</option><option value="lunch">Обед</option><option value="dinner">Ужин</option><option value="snack">Перекус</option></select></div>
      </div>
      <div class="card" style="margin-top:12px;box-shadow:none" id="amountPreview"></div>
      <div class="error" id="addError"></div>
      <button class="btn block" id="confirmAdd">Добавить в дневник</button>
    </div>
  </div>
</div>

<div class="toast hidden" id="toast"></div>

<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const $$ = (s) => [...document.querySelectorAll(s)];
  const MEALS = ["breakfast", "lunch", "dinner", "snack"];
  const MEAL_LABEL = { breakfast: "Завтрак", lunch: "Обед", dinner: "Ужин", snack: "Перекус" };
  const ALLERGEN_LABEL = { gluten: "глютен", dairy: "молочное", egg: "яйца", nuts: "орехи", peanuts: "арахис", soy: "соя", fish: "рыба", shellfish: "морепродукты", sesame: "кунжут" };
  const FIELD_LABEL = { email: "Эл. почта", password: "Пароль", name: "Имя", birth_date: "Дата рождения", height_cm: "Рост", weight_kg: "Вес", body_fat_pct: "Процент жира", weekly_rate_kg: "Темп", grams: "Граммы", servings: "Порции", excluded_allergens: "Аллергены" };
  const ALLERGENS = ["gluten", "dairy", "egg", "nuts", "peanuts", "soy", "fish", "shellfish", "sesame"];
  const FORMULA = { mifflin_st_jeor: "Миффлин — Сан-Жеор", katch_mcardle: "Кэтч — МакАрдл", harris_benedict: "Харрис — Бенедикт (пересм.)" };

  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} },
  };

  // Telegram Mini App: present when opened from the bot, initData is signed by Telegram.
  const tg = window.Telegram && window.Telegram.WebApp;
  const inTelegram = Boolean(tg && tg.initData);

  // Inside Telegram the token stays in memory: several Telegram accounts on one
  // device share WebView storage, so every launch signs in again from initData.
  const state = { token: inTelegram ? null : store.get("ct_token"), user: null, day: new Date(), tab: "today", menu: null, source: "foods", pick: null, goal: "maintain", allergens: new Set() };

  const iso = (d) => new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
  const fmt = (n) => Math.round(n).toLocaleString("ru-RU");
  const num = (n) => n.toLocaleString("ru-RU", { maximumFractionDigits: 2 });
  const date = (d, opts) => d.toLocaleDateString("ru-RU", opts);
  // Russian plural forms: [1 порция, 2 порции, 5 порций]; fractions take the second form.
  function plural(n, [one, few, many]) {
    if (!Number.isInteger(n)) return few;
    const m10 = n % 10, m100 = n % 100;
    return m10 === 1 && m100 !== 11 ? one : m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14) ? few : many;
  }
  const servings = (n) => `${num(n)} ${plural(n, ["порция", "порции", "порций"])}`;
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  async function api(path, { method = "GET", body } = {}) {
    const headers = { "Content-Type": "application/json" };
    if (state.token) headers.Authorization = `Bearer ${state.token}`;
    const res = await fetch(path, { method, headers, body: body === undefined ? undefined : JSON.stringify(body) });
    if (res.status === 204) return null;
    const data = await res.json().catch(() => null);
    if (res.status === 401 && state.token) {
      if (inTelegram) { state.token = null; telegramLogin(); throw new Error("Сессия истекла, входим заново…"); }
      logout(); throw new Error("Сессия истекла, войдите снова.");
    }
    if (!res.ok) {
      const d = data && data.detail;
      const msg = Array.isArray(d) ? d.map(validationMessage).join("; ") : d || `Ошибка запроса (${res.status})`;
      const err = new Error(msg); err.status = res.status; throw err;
    }
    return data;
  }

  // FastAPI validation errors come in English; show which field is wrong in Russian.
  function validationMessage(e) {
    const field = FIELD_LABEL[e.loc?.slice(-1)[0]];
    // Our own validators already speak Russian; library messages (e.g. email format) do not.
    if (e.type === "value_error" && /[а-яё]/i.test(e.msg)) return e.msg.replace(/^Value error,\s*/, "");
    return field ? `Проверьте поле «${field}»` : "Проверьте введённые данные";
  }

  let toastTimer;
  function toast(msg) {
    const t = $("#toast"); t.textContent = msg; t.classList.remove("hidden");
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.add("hidden"), 2200);
  }

  // ---------------- auth ----------------
  let authMode = "login";
  $("#authSeg").addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    authMode = b.dataset.mode;
    $$("#authSeg button").forEach((x) => x.classList.toggle("on", x === b));
    $("#nameField").classList.toggle("hidden", authMode !== "register");
    $("#authSubmit").textContent = authMode === "register" ? "Зарегистрироваться" : "Войти";
    $("#authPassword").autocomplete = authMode === "register" ? "new-password" : "current-password";
    $("#authError").textContent = "";
  });

  $("#authForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = $("#authSubmit"); btn.disabled = true; $("#authError").textContent = "";
    try {
      const body = { email: $("#authEmail").value.trim(), password: $("#authPassword").value };
      if (authMode === "register") body.name = $("#authName").value.trim();
      const res = await api(`/api/auth/${authMode}`, { method: "POST", body });
      state.token = res.access_token; store.set("ct_token", res.access_token);
      state.user = res.user; enterApp();
    } catch (err) { $("#authError").textContent = err.message; }
    finally { btn.disabled = false; }
  });

  function logout() {
    state.token = null; state.user = null; store.set("ct_token", null);
    $("#loading").classList.add("hidden");
    $("#app").classList.add("hidden"); $("#bnb").classList.add("hidden"); $("#auth").classList.remove("hidden");
  }
  $("#logout").addEventListener("click", logout);

  function applyTelegramTheme() {
    const p = tg.themeParams || {}, root = document.documentElement.style;
    document.documentElement.dataset.theme = tg.colorScheme === "dark" ? "dark" : "light";
    // Native Telegram surfaces and text; the green brand accent is kept.
    const map = { "--bg": p.secondary_bg_color, "--surface": p.section_bg_color || p.bg_color, "--text": p.text_color, "--muted": p.hint_color, "--danger": p.destructive_text_color };
    for (const [k, v] of Object.entries(map)) v ? root.setProperty(k, v) : root.removeProperty(k);
    if (p.secondary_bg_color) { tg.setHeaderColor?.(p.secondary_bg_color); tg.setBackgroundColor?.(p.secondary_bg_color); }
    tg.setBottomBarColor?.(p.section_bg_color || p.bg_color || p.secondary_bg_color);
  }

  function initTelegram() {
    tg.ready(); tg.expand(); tg.disableVerticalSwipes?.();
    applyTelegramTheme(); tg.onEvent("themeChanged", applyTelegramTheme);
    tg.BackButton.onClick(onBack);
    $("#logout").classList.add("hidden");
  }

  async function telegramLogin() {
    $("#loading").classList.remove("hidden");
    try {
      const res = await api("/api/auth/telegram", { method: "POST", body: { init_data: tg.initData } });
      state.token = res.access_token; state.user = res.user;
      $("#loading").classList.add("hidden"); enterApp();
    } catch (err) {
      logout(); $("#authError").textContent = `Не удалось войти через Telegram: ${err.message}`;
    }
  }

  async function boot() {
    if (inTelegram) { initTelegram(); return telegramLogin(); }
    if (!state.token) return logout();
    try { state.user = await api("/api/auth/me"); enterApp(); } catch { logout(); }
  }

  const haptic = (type) => { try { inTelegram && tg.HapticFeedback.notificationOccurred(type); } catch {} };

  function enterApp() {
    $("#auth").classList.add("hidden"); $("#app").classList.remove("hidden"); $("#bnb").classList.remove("hidden");
    if (!state.user.has_profile) { switchTab("profile"); $("#profileTitle").textContent = `${state.user.name}, добро пожаловать! Расскажите о себе`; }
    else switchTab("today");
  }

  // ---------------- navigation ----------------
  $("#bnb").addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.dataset.tab === "add") return openSheet();
    switchTab(b.dataset.tab);
  });

  function switchTab(tab) {
    if (!state.user?.has_profile && tab !== "profile") { toast("Сначала заполните профиль"); tab = "profile"; }
    state.tab = tab;
    $$("[data-view]").forEach((v) => v.classList.toggle("hidden", v.dataset.view !== tab));
    $$("#bnb [data-tab]").forEach((b) => b.classList.toggle("on", b.dataset.tab === tab));
    window.scrollTo(0, 0);
    ({ today: loadToday, menu: loadMenu, progress: loadProgress, profile: loadProfile })[tab]();
  }

  // ---------------- today ----------------
  $("#prevDay").addEventListener("click", () => { state.day.setDate(state.day.getDate() - 1); loadToday(); });
  $("#nextDay").addEventListener("click", () => { state.day.setDate(state.day.getDate() + 1); loadToday(); });

  function dayTitle(d) {
    const diff = Math.round((new Date(iso(d)) - new Date(iso(new Date()))) / 86400000);
    const name = diff === 0 ? "Сегодня" : diff === -1 ? "Вчера" : diff === 1 ? "Завтра" : date(d, { weekday: "long" });
    return name[0].toUpperCase() + name.slice(1);
  }

  function macroBar(label, color, value, target) {
    const pct = target ? Math.min(100, (value / target) * 100) : 0;
    return `<div class="macro"><div class="row between small"><span>${label}</span><span class="muted">${fmt(value)} / ${target ? fmt(target) : "–"} г</span></div>
      <div class="bar"><i style="width:${pct}%;background:${color}"></i></div></div>`;
  }

  async function loadToday() {
    $("#dayTitle").textContent = dayTitle(state.day);
    $("#daySub").textContent = date(state.day, { day: "numeric", month: "long" });
    const data = await api(`/api/diary?date=${iso(state.day)}`);
    const t = data.targets, tot = data.totals;
    $("#eaten").textContent = fmt(tot.kcal);
    $("#target").textContent = t ? fmt(t.kcal) : "–";
    const over = t && tot.kcal > t.kcal;
    $("#remaining").textContent = t ? fmt(Math.abs(t.kcal - tot.kcal)) : fmt(tot.kcal);
    $("#remainingLabel").textContent = over ? "ккал сверх нормы" : "ккал осталось";
    const circ = 2 * Math.PI * 56, frac = t ? Math.min(1, tot.kcal / t.kcal) : 0;
    const arc = $("#ringArc");
    arc.setAttribute("stroke-dasharray", `${frac * circ} ${circ}`);
    arc.setAttribute("stroke", over ? "var(--fat)" : "var(--accent)");
    arc.style.visibility = frac > 0 ? "visible" : "hidden";  // a round cap would draw a dot at 0
    $("#macroBars").innerHTML =
      macroBar("Белки", "var(--protein)", tot.protein, t?.protein) +
      macroBar("Жиры", "var(--fat)", tot.fat, t?.fat) +
      macroBar("Углеводы", "var(--carbs)", tot.carbs, t?.carbs);

    $("#meals").innerHTML = MEALS.map((m) => {
      const entries = data.entries.filter((e) => e.meal_type === m);
      const kcal = entries.reduce((s, e) => s + e.kcal, 0);
      return `<div class="card"><div class="meal-head"><h2 style="margin:0">${MEAL_LABEL[m]} <span class="muted small">${fmt(kcal)} ккал</span></h2>
        <button class="btn ghost sm" data-add-meal="${m}">+ Добавить</button></div>
        <div style="margin-top:6px">${entries.map((e) => `<div class="entry"><div class="grow"><div>${esc(e.name)}</div>
          <div class="small muted">${e.servings ? `${servings(e.servings)} · ` : ""}${fmt(e.grams)} г · Б ${fmt(e.protein)} · Ж ${fmt(e.fat)} · У ${fmt(e.carbs)}</div></div>
          <span class="kcal">${fmt(e.kcal)}</span><button data-del="${e.id}" aria-label="Удалить">×</button></div>`).join("")}</div></div>`;
    }).join("");
  }

  $("#meals").addEventListener("click", async (e) => {
    const add = e.target.closest("[data-add-meal]");
    if (add) return openSheet(add.dataset.addMeal);
    const del = e.target.closest("[data-del]");
    if (del) { await api(`/api/diary/${del.dataset.del}`, { method: "DELETE" }); loadToday(); }
  });

  // ---------------- add sheet ----------------
  function defaultMeal() {
    const h = new Date().getHours();
    return h < 11 ? "breakfast" : h < 16 ? "lunch" : h < 21 ? "dinner" : "snack";
  }

  function openSheet(meal) {
    if (!state.user?.has_profile) return switchTab("profile");
    $("#mealSelect").value = meal || defaultMeal();
    $("#sheet").classList.remove("hidden"); $("#sheetBackdrop").classList.remove("hidden");
    showSearch(); $("#searchInput").value = ""; search();
    if (inTelegram) tg.BackButton.show(); else $("#searchInput").focus();
  }
  function closeSheet() {
    $("#sheet").classList.add("hidden"); $("#sheetBackdrop").classList.add("hidden");
    if (inTelegram) tg.BackButton.hide();
  }
  function onBack() {
    if (!$("#amountStep").classList.contains("hidden")) showSearch(); else closeSheet();
  }
  $("#sheetBackdrop").addEventListener("click", closeSheet);
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeSheet(); });

  $("#sourceSeg").addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    state.source = b.dataset.src;
    $$("#sourceSeg button").forEach((x) => x.classList.toggle("on", x === b));
    search();
  });

  let searchTimer, searchSeq = 0;
  $("#searchInput").addEventListener("input", () => { clearTimeout(searchTimer); searchTimer = setTimeout(search, 200); });

  async function search() {
    const q = encodeURIComponent($("#searchInput").value.trim());
    const seq = ++searchSeq;
    const items = state.source === "foods" ? await api(`/api/foods?q=${q}`) : await api(`/api/dishes?q=${q}`);
    if (seq !== searchSeq) return;
    state.results = items;
    $("#results").innerHTML = items.length ? items.map((it, i) => `<div class="result" data-i="${i}">
      <div class="grow"><div>${esc(it.name)}${it.is_custom ? ' <span class="tag">мой</span>' : ""}</div>
      <div class="small muted">${state.source === "foods" ? "на 100 г" : `${MEAL_LABEL[it.meal_type]} · порция ${fmt(it.grams)} г`} · Б ${fmt(it.protein)} · Ж ${fmt(it.fat)} · У ${fmt(it.carbs)}</div></div>
      <b>${fmt(it.kcal)}</b></div>`).join("") : `<div class="empty">Ничего не найдено</div>`;
  }

  $("#results").addEventListener("click", (e) => {
    const r = e.target.closest("[data-i]"); if (!r) return;
    const item = state.results[+r.dataset.i];
    state.pick = { ...item, kind: state.source };
    $("#searchStep").classList.add("hidden"); $("#amountStep").classList.remove("hidden");
    $("#pickName").textContent = item.name;
    const isFood = state.source === "foods";
    $("#pickInfo").textContent = isFood ? `${fmt(item.kcal)} ккал на 100 г` : `${item.description} ${item.allergens.length ? "· Содержит: " + item.allergens.map((a) => ALLERGEN_LABEL[a] || a).join(", ") : ""}`;
    $("#amountLabel").textContent = isFood ? "Граммы" : "Порции";
    $("#amount").step = isFood ? "1" : "0.25";
    $("#amount").value = isFood ? 100 : 1;
    if (!isFood) $("#mealSelect").value = item.meal_type;
    $("#addError").textContent = "";
    preview();
  });
  function showSearch() { $("#searchStep").classList.remove("hidden"); $("#amountStep").classList.add("hidden"); }
  $("#backToSearch").addEventListener("click", showSearch);
  $("#amount").addEventListener("input", preview);

  function preview() {
    const p = state.pick, a = parseFloat($("#amount").value) || 0;
    const f = p.kind === "foods" ? a / 100 : a;
    $("#amountPreview").innerHTML = `<div class="row between"><b>${fmt(p.kcal * f)} ккал</b>
      <span class="macros-inline"><span class="dot" style="background:var(--protein)"></span>Б <b>${fmt(p.protein * f)}</b>
      <span class="dot" style="background:var(--fat)"></span>Ж <b>${fmt(p.fat * f)}</b>
      <span class="dot" style="background:var(--carbs)"></span>У <b>${fmt(p.carbs * f)}</b></span></div>`;
  }

  $("#confirmAdd").addEventListener("click", async () => {
    const p = state.pick, a = parseFloat($("#amount").value);
    const body = { eaten_on: iso(state.day), meal_type: $("#mealSelect").value };
    if (p.kind === "foods") Object.assign(body, { food_id: p.id, grams: a });
    else Object.assign(body, { dish_id: p.id, servings: a });
    try {
      await api("/api/diary", { method: "POST", body });
      closeSheet(); haptic("success"); toast(`Добавлено: ${p.name}`);
      if (state.tab !== "today") switchTab("today"); else loadToday();
    } catch (err) { $("#addError").textContent = err.message; }
  });

  // ---------------- menu ----------------
  function renderMenu(plan) {
    state.menu = plan;
    $("#menuDate").textContent = date(new Date((plan ? plan.plan_date : iso(state.day)) + "T00:00"), { weekday: "long", day: "numeric", month: "long" });
    $("#logMenu").classList.toggle("hidden", !plan);
    if (!plan) {
      $("#menuTotals").textContent = "";
      $("#menuCard").innerHTML = `<div class="empty">Подберём меню из готовых блюд под вашу норму калорий и БЖУ.</div>`;
      return;
    }
    const t = plan.totals, g = plan.targets;
    $("#menuTotals").innerHTML = `<div style="font-size:18px"><b>${fmt(t.kcal)}</b> <span class="small muted">/ ${fmt(g.kcal)} ккал</span></div>
      <div class="macros-inline"><span class="nw"><span class="dot" style="background:var(--protein);margin-left:0"></span>Б ${fmt(t.protein)}/${fmt(g.protein)}</span> <span class="nw"><span class="dot" style="background:var(--fat)"></span>Ж ${fmt(t.fat)}/${fmt(g.fat)}</span> <span class="nw"><span class="dot" style="background:var(--carbs)"></span>У ${fmt(t.carbs)}/${fmt(g.carbs)}</span></div>`;
    $("#menuCard").innerHTML = plan.items.map((i) => `<div class="dish"><div class="grow">
      <div class="meal">${MEAL_LABEL[i.meal_type]}</div>
      <div class="name">${esc(i.name)}</div>
      <div class="small muted">${servings(i.servings)} · ${fmt(i.grams)} г · <b class="nw" style="color:var(--text)">${fmt(i.kcal)} ккал</b></div>
      <div class="macros-inline"><span class="dot" style="background:var(--protein)"></span>Б ${fmt(i.protein)}<span class="dot" style="background:var(--fat)"></span>Ж ${fmt(i.fat)}<span class="dot" style="background:var(--carbs)"></span>У ${fmt(i.carbs)}</div>
      </div><div style="display:flex;flex-direction:column;gap:6px">
        <button class="btn ghost sm" data-swap="${i.id}">Заменить</button>
        <button class="btn ghost sm" data-log="${i.id}">+ В дневник</button>
      </div></div>`).join("");
  }

  async function loadMenu() {
    $("#menuError").textContent = "";
    try { renderMenu(await api(`/api/menu?date=${iso(state.day)}`)); }
    catch (err) { if (err.status === 404) renderMenu(null); else $("#menuError").textContent = err.message; }
  }

  $("#genMenu").addEventListener("click", async () => {
    const b = $("#genMenu"); b.disabled = true; $("#menuError").textContent = "";
    try { renderMenu(await api("/api/menu/generate", { method: "POST", body: { plan_date: iso(state.day) } })); b.textContent = "Обновить"; }
    catch (err) { $("#menuError").textContent = err.message; }
    finally { b.disabled = false; }
  });

  $("#menuCard").addEventListener("click", async (e) => {
    const swap = e.target.closest("[data-swap]"), log = e.target.closest("[data-log]");
    try {
      if (swap) renderMenu(await api(`/api/menu/${state.menu.id}/items/${swap.dataset.swap}/swap?seed=${Math.floor(Math.random() * 1e9) + 1}`, { method: "POST" }));
      if (log) { await api(`/api/menu/${state.menu.id}/log`, { method: "POST", body: { item_ids: [+log.dataset.log] } }); toast("Добавлено в дневник"); }
    } catch (err) { $("#menuError").textContent = err.message; }
  });

  $("#logMenu").addEventListener("click", async () => {
    await api(`/api/menu/${state.menu.id}/log`, { method: "POST", body: {} });
    toast("Меню добавлено в дневник"); switchTab("today");
  });

  // ---------------- progress ----------------
  async function loadProgress() {
    const [hist, weights, targets] = await Promise.all([api("/api/diary/history?days=7"), api("/api/weights?days=90"), api("/api/profile/targets")]);
    const max = Math.max(targets.target_kcal * 1.2, ...hist.map((h) => h.kcal));
    $("#historyBars").innerHTML = `<div class="target-line" style="bottom:${(targets.target_kcal / max) * 100 * 0.82 + 18}px" title="Норма"></div>` +
      hist.map((h) => `<div class="col"><i class="${h.kcal > targets.target_kcal * 1.05 ? "over" : ""}" style="height:${(h.kcal / max) * 82}%" title="${fmt(h.kcal)} ккал"></i>
        <span>${date(new Date(h.date + "T00:00"), { weekday: "short" })}</span></div>`).join("");
    const logged = hist.filter((h) => h.kcal > 0);
    $("#historyAvg").textContent = logged.length ? `В среднем ${fmt(logged.reduce((s, h) => s + h.kcal, 0) / logged.length)} ккал за ${logged.length} ${plural(logged.length, ["день", "дня", "дней"])} с записями · норма ${fmt(targets.target_kcal)}` : "На этой неделе записей о питании пока нет.";
    $("#weightList").innerHTML = weights.length ? weights.slice().reverse().slice(0, 10).map((w, i, arr) => {
      const prev = arr[i + 1]; const d = prev ? w.weight_kg - prev.weight_kg : 0;
      return `<div><span>${date(new Date(w.logged_on + "T00:00"), { day: "numeric", month: "short" })}</span>
        <span><b>${num(+w.weight_kg.toFixed(1))} кг</b> ${prev ? `<span class="small muted">${d > 0 ? "+" : ""}${num(+d.toFixed(1))}</span>` : ""}</span></div>`;
    }).join("") : `<div class="empty">Взвешиваний пока нет</div>`;
  }

  $("#weightForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    try {
      await api("/api/weights", { method: "POST", body: { logged_on: iso(new Date()), weight_kg: parseFloat($("#weightInput").value) } });
      $("#weightInput").value = ""; toast("Вес сохранён, норма пересчитана"); loadProgress();
    } catch (err) { toast(err.message); }
  });

  // ---------------- profile ----------------
  $("#allergenChips").innerHTML = ALLERGENS.map((a) => `<button type="button" class="chip" data-a="${a}">${ALLERGEN_LABEL[a]}</button>`).join("");
  $("#allergenChips").addEventListener("click", (e) => {
    const c = e.target.closest("[data-a]"); if (!c) return;
    state.allergens.has(c.dataset.a) ? state.allergens.delete(c.dataset.a) : state.allergens.add(c.dataset.a);
    c.classList.toggle("on", state.allergens.has(c.dataset.a));
  });
  $("#goalSeg").addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) setGoal(b.dataset.v); });
  function setGoal(g) {
    state.goal = g;
    $$("#goalSeg button").forEach((b) => b.classList.toggle("on", b.dataset.v === g));
    $("#rateField").classList.toggle("hidden", g === "maintain");
  }
  $("#pRate").addEventListener("input", () => { $("#rateLabel").textContent = num(+$("#pRate").value); });

  function fillProfile(p) {
    $("#pSex").value = p.sex; $("#pBirth").value = p.birth_date; $("#pHeight").value = p.height_cm; $("#pWeight").value = p.weight_kg;
    $("#pFat").value = p.body_fat_pct ?? ""; $("#pActivity").value = p.activity_level; $("#pDiet").value = p.diet_type;
    $("#pMeals").value = String(p.meals_per_day); $("#pRate").value = p.weekly_rate_kg || 0.5;
    state.allergens = new Set(p.excluded_allergens);
    $$("#allergenChips .chip").forEach((c) => c.classList.toggle("on", state.allergens.has(c.dataset.a)));
    setGoal(p.goal); $("#rateLabel").textContent = num(+$("#pRate").value);
  }

  function renderTargets(t) {
    const est = Object.entries(t.bmr_estimates).map(([k, v]) => `<div class="row between small"><span class="${k === t.bmr_formula ? "" : "muted"}">${FORMULA[k]}${k === t.bmr_formula ? " ✓" : ""}</span><span>${fmt(v)} ккал</span></div>`).join("");
    $("#targetsCard").innerHTML = `<div class="row between"><div><div class="small muted">Норма в день</div><div style="font-size:28px;font-weight:700">${fmt(t.target_kcal)} <span class="small muted">ккал</span></div></div>
      <div style="text-align:right" class="small"><div>ИМТ <b>${num(t.bmi)}</b></div><div class="muted">Расход ${fmt(t.tdee)} · ${t.daily_adjustment > 0 ? "+" : ""}${fmt(t.daily_adjustment)}</div></div></div>
      <div class="grid2 small" style="margin-top:10px;grid-template-columns:repeat(3,auto);justify-content:space-between;white-space:nowrap">
        <div><span class="dot" style="background:var(--protein);margin-left:0"></span>Белки <b>${fmt(t.protein_g)} г</b></div>
        <div><span class="dot" style="background:var(--fat);margin-left:0"></span>Жиры <b>${fmt(t.fat_g)} г</b></div>
        <div><span class="dot" style="background:var(--carbs);margin-left:0"></span>Углеводы <b>${fmt(t.carbs_g)} г</b></div></div>
      <details style="margin-top:10px"><summary class="small muted" style="cursor:pointer">Как рассчитано</summary>
        <div style="margin-top:8px">${est}
        <div class="small muted" style="margin-top:6px">Базовый обмен ${fmt(t.bmr)} × активность ${num(t.activity_factor)} = расход ${fmt(t.tdee)} ккал. По приёмам пищи: ${Object.entries(t.meal_split).map(([m, k]) => `${MEAL_LABEL[m].toLowerCase()} ${fmt(k)}`).join(" · ")}.</div></div></details>
      ${t.warnings.map((w) => `<div class="warn">${esc(w)}</div>`).join("")}`;
    $("#targetsCard").classList.remove("hidden");
  }

  async function loadProfile() {
    $("#profileError").textContent = "";
    if (!state.user.has_profile) {
      fillProfile({ sex: "female", birth_date: "1995-01-01", height_cm: "", weight_kg: "", activity_level: "light", diet_type: "omnivore", meals_per_day: 4, weekly_rate_kg: 0.5, excluded_allergens: [], goal: "maintain" });
      $("#targetsCard").classList.add("hidden");
      return;
    }
    $("#profileTitle").textContent = state.user.name;
    const [p, t] = await Promise.all([api("/api/profile"), api("/api/profile/targets")]);
    fillProfile(p); renderTargets(t);
  }

  $("#profileForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = $("#saveProfile"); btn.disabled = true; $("#profileError").textContent = "";
    const fat = $("#pFat").value;
    const body = {
      sex: $("#pSex").value, birth_date: $("#pBirth").value,
      height_cm: parseFloat($("#pHeight").value), weight_kg: parseFloat($("#pWeight").value),
      body_fat_pct: fat === "" ? null : parseFloat(fat), activity_level: $("#pActivity").value,
      goal: state.goal, weekly_rate_kg: state.goal === "maintain" ? 0 : parseFloat($("#pRate").value),
      diet_type: $("#pDiet").value, excluded_allergens: [...state.allergens], meals_per_day: +$("#pMeals").value,
    };
    try {
      await api("/api/profile", { method: "PUT", body });
      const first = !state.user.has_profile;
      state.user.has_profile = true;
      toast("Профиль сохранён");
      if (first) switchTab("today"); else loadProfile();
    } catch (err) { $("#profileError").textContent = err.message; }
    finally { btn.disabled = false; }
  });

  boot();
})();
</script>
</body>
</html>
